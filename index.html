<script>
var S={students:[],groups:[],profile:{name:'مَحْمُود',photo:''}};
var ui={tab:'today',date:today(),month:today().slice(0,7),sid:null,gid:null,gf:'all',del:null,rep:null,adding:false,addG:false,back:'students',rt:'w',rdate:today()};
var ref=null,timer=null,SK='halaqa-v1';
var DN=[[6,'السَّبْت'],[0,'الأَحَد'],[1,'الاِثْنَيْن'],[2,'الثُّلَاثَاء'],[3,'الأَرْبِعَاء'],[4,'الخَمِيس'],[5,'الجُمُعَة']];

var MSGS=["خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ ﷺ", "﴿وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِنْ مُدَّكِرٍ﴾", "المَاهِرُ بِالقُرْآنِ مَعَ السَّفَرَةِ الكِرَامِ البَرَرَةِ ﷺ", "اقْرَؤُوا القُرْآنَ فَإِنَّهُ يَأْتِي يَوْمَ القِيَامَةِ شَفِيعًا لِأَصْحَابِهِ ﷺ", "يُقَالُ لِصَاحِبِ القُرْآنِ: اقْرَأْ وَارْتَقِ وَرَتِّلْ كَمَا كُنْتَ تُرَتِّلُ فِي الدُّنْيَا ﷺ", "مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللهِ فَلَهُ بِهِ حَسَنَةٌ، وَالحَسَنَةُ بِعَشْرِ أَمْثَالِهَا ﷺ", "أَهْلُ القُرْآنِ هُمْ أَهْلُ اللهِ وَخَاصَّتُهُ ﷺ", "﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾", "﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾", "﴿وَقُلْ رَبِّ زِدْنِي عِلْمًا﴾", "مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ ﷺ", "مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللهُ لَهُ بِهِ طَرِيقًا إِلَى الجَنَّةِ ﷺ", "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾", "﴿إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾", "﴿فَاذْكُرُونِي أَذْكُرْكُمْ﴾", "﴿وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ﴾", "﴿وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا﴾", "صَبْرُكَ عَلَى طُلَّابِكَ عِبَادَةٌ، وَكُلُّ حَرْفٍ يَتَعَلَّمُونَهُ فِي مِيزَانِكَ بِإِذْنِ اللهِ.", "أَنْتَ تَغْرِسُ فِي قُلُوبِهِمْ نُورًا لَا يَنْطَفِئُ، فَاسْتَمِرَّ وَلَا تَمَلَّ.", "مَا أَعْظَمَ أَنْ تَكُونَ سَبَبًا فِي أَنْ يَنْطِقَ لِسَانٌ بِكَلَامِ اللهِ!", "ابْدَأْ يَوْمَكَ بِالبَسْمَلَةِ، وَاخْتِمْهُ بِالحَمْدَلَةِ، وَبَيْنَهُمَا قُرْآنٌ.", "كُلُّ طَالِبٍ تُحَفِّظُهُ هُوَ صَدَقَةٌ جَارِيَةٌ لَكَ بِإِذْنِ اللهِ.", "الإِخْلَاصُ أَوَّلُ الطَّرِيقِ، وَالصَّبْرُ زَادُهُ، وَالقُرْآنُ غَايَتُهُ.", "لَا تَسْتَقِلَّ قَلِيلَ العَمَلِ؛ فَقَطَرَاتُ المَاءِ تَصْنَعُ الأَنْهَارَ.", "رَبِّ اجْعَلْنَا مِنْ أَهْلِ القُرْآنِ الَّذِينَ هُمْ أَهْلُكَ وَخَاصَّتُكَ.", "اللَّهُمَّ بَارِكْ فِي وَقْتِكَ وَجُهْدِكَ، وَاجْعَلْ عَمَلَكَ خَالِصًا لِوَجْهِهِ الكَرِيمِ.", "تَعْلِيمُ القُرْآنِ شَرَفٌ لَا يَنَالُهُ إِلَّا مَنِ اصْطَفَاهُ اللهُ.", "ابْتَسِمْ لِطَالِبِكَ؛ فَبَسْمَتُكَ تُحَبِّبُ إِلَيْهِ القُرْآنَ.", "اللِّينُ فِي التَّعْلِيمِ يَفْتَحُ القُلُوبَ قَبْلَ الأَسْمَاعِ.", "دَعْوَةٌ صَادِقَةٌ لِطُلَّابِكَ فِي ظَهْرِ الغَيْبِ تَصْنَعُ مَا لَا تَصْنَعُهُ الكَلِمَاتُ.", "لَا تَيْأَسْ مِنْ طَالِبٍ بَطِيءِ الحِفْظِ؛ فَرُبَّ بَطِيءٍ صَارَ إِمَامًا.", "مَنْ صَبَرَ عَلَى تَحْفِيظِ القُرْآنِ نَالَ شَرَفَ الدُّنْيَا وَفَضْلَ الآخِرَةِ.", "اجْعَلْ لِنَفْسِكَ وِرْدًا لَا تَتْرُكُهُ، فَالمُعَلِّمُ أَوَّلُ مَنْ يَلْتَزِمُ.", "أَحَبُّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ ﷺ", "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، فَجَدِّدْ نِيَّتَكَ كُلَّ يَوْمٍ ﷺ", "تَعَاهَدُوا القُرْآنَ فَوَالَّذِي نَفْسِي بِيَدِهِ لَهُوَ أَشَدُّ تَفَلُّتًا مِنَ الإِبِلِ فِي عُقُلِهَا ﷺ", "﴿هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾", "﴿يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾", "مَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللهِ يَتْلُونَ كِتَابَ اللهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ ﷺ", "حَلْقَاتُ القُرْآنِ تَحُفُّهَا المَلَائِكَةُ وَتَغْشَاهَا الرَّحْمَةُ.", "كُنْ لِطُلَّابِكَ قُدْوَةً قَبْلَ أَنْ تَكُونَ مُعَلِّمًا.", "الطَّالِبُ الغَائِبُ اليَوْمَ قَدْ يَعُودُ غَدًا بِهِمَّةٍ أَعْلَى؛ فَاصْبِرْ عَلَيْهِ.", "كَمْ مِنْ آيَةٍ حَفِظَهَا طَالِبُكَ سَتَشْهَدُ لَكَ يَوْمَ القِيَامَةِ بِإِذْنِ اللهِ.", "احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللهِ وَلَا تَعْجِزْ ﷺ", "رَبِّ يَسِّرْ وَلَا تُعَسِّرْ، رَبِّ تَمِّمْ بِالخَيْرِ.", "بَارَكَ اللهُ فِي عُمُرِكَ وَعِلْمِكَ وَطُلَّابِكَ، وَجَعَلَ القُرْآنَ رَبِيعَ قَلْبِكَ.", "كُلُّ خُطْوَةٍ فِي طَرِيقِ القُرْآنِ تَرْفَعُكَ دَرَجَةً، فَلَا تَتَوَقَّفْ.", "﴿إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾", "يَوْمٌ مَعَ القُرْآنِ يُنِيرُ الدُّنْيَا وَالآخِرَةَ؛ فَابْدَأْهُ بِهِمَّةٍ.", "سَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا ﷺ"];
var MSG=(function(){var k='halaqa-msg',i=Math.floor(Math.random()*MSGS.length);try{var l=localStorage.getItem(k);if(l!==null&&+l===i)i=(i+1)%MSGS.length;localStorage.setItem(k,String(i))}catch(e){}return MSGS[i]})();
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function A(f){var a=[].slice.call(arguments,1).map(function(x){return "'"+x+"'"}).join(',');return 'onclick="'+f+'('+a+')"'}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},3500)}
function stu(id){return S.students.find(function(s){return s.id===id})}
function grp(id){return id?S.groups.find(function(g){return g.id===id}):null}
function inGf(s){return ui.gf==='all'||(ui.gf==='_'?!grp(s.gid):s.gid===ui.gf)}
function toTop(){window.scrollTo(0,0)}

/* ---------- الحفظ والتحميل ---------- */
function fix(){
  S.students=S.students||[];S.groups=S.groups||[];S.profile=S.profile||{name:'مَحْمُود',photo:''};applyTheme();
  S.students.forEach(function(s){s.recs=s.recs||{};s.days=s.days||[];s.plan=s.plan||{};if(!s.joined){var k=Object.keys(s.recs).sort();s.joined=k.length?k[0]:today()}});
}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}
  clearTimeout(timer);
  timer=setTimeout(function(){if(ref){try{ref.set(JSON.parse(JSON.stringify(S))).catch(function(){})}catch(e){}}},600);
}
async function load(){
  try{var l=JSON.parse(localStorage.getItem(SK)||'null');if(l&&l.students)S=l}catch(e){}
  fix();render();
  try{
    if(window.claude){
      var u=await claude.use('user'),db=await claude.use('db');
      if(u&&db){
        var id=await u.id();
        if(id){
          ref=db.doc('data/users/'+id+'/app');
          var snap=await ref.get(),dd=snap.exists?snap.data():null;
          if(dd&&dd.students&&(dd.updated||0)>(S.updated||0)){S=dd;fix();try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
          else if(S.students.length||S.groups.length){ref.set(JSON.parse(JSON.stringify(S)))}
          if(!ui.adding&&!ui.addG&&ui.tab!=='student')render();

/* ---------- حسابات ---------- */
function rec(s,d){return (s.recs||{})[d]}
function setRec(s,d,patch){s.recs=s.recs||{};var r=s.recs[d]||{att:'',res:'',pages:0,note:''};Object.assign(r,patch);s.recs[d]=r;save()}
function resOf(r){return r.res||(r.done?'h':'')}
function okRes(r){var q=resOf(r);return q==='h'||q==='r'}
function isDay(s,d){return (s.days||[]).indexOf(new Date(d+'T12:00:00').getDay())>-1}
function dates(s){var ds=Object.keys(s.recs||{}).sort();return (s.days&&s.days.length)?ds.filter(function(d){return isDay(s,d)}):ds}
function streak(s){var ds=dates(s).reverse(),n=0;for(var i=0;i<ds.length;i++){var r=s.recs[ds[i]];if(!r.att||r.att==='e')continue;if(r.att==='p'&&okRes(r))n++;else break}return n}
function best(s){var n=0,b=0;dates(s).forEach(function(d){var r=s.recs[d];if(!r.att||r.att==='e')return;if(r.att==='p'&&okRes(r)){n++;if(n>b)b=n}else n=0});return b}
function nextGoal(n){return [7,14,30,60,100,200,365].find(function(m){return m>n})||n+100}
function agg(s,f){
  var o={p:0,e:0,x:0,done:0,rep:0,none:0,pages:0};
  Object.keys(s.recs||{}).forEach(function(d){if(f&&!f(d))return;var v=s.recs[d];
    if(v.att==='p'){o.p++;var q=resOf(v);if(q==='h')o.done++;else if(q==='r')o.rep++;else o.none++;o.pages+=Number(v.pages)||0}
    else if(v.att==='e')o.e++;else if(v.att==='x')o.x++});
  o.total=o.p+o.e+o.x;o.pct=o.total?Math.round(o.p/o.total*100):0;return o;
}
function monthStats(s,m){return agg(s,function(d){return d.slice(0,7)===m})}
function schedCount(s){if(!(s.days&&s.days.length))return 0;var n=0,d=new Date(s.joined+'T12:00:00'),end=new Date(today()+'T12:00:00');while(d<=end){if(s.days.indexOf(d.getDay())>-1)n++;d.setDate(d.getDate()+1)}return n}
function planChips(s){var p=s.plan||{};return ['h','t','m'].filter(function(k){return p[k]}).map(function(k){return '<span class="chip">'+{h:'حِفْظٌ',t:'تَثْبِيتٌ',m:'مُرَاجَعَةٌ'}[k]+'</span>'}).join('')}
function monthName(m){var a=m.split('-');return ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][+a[1]-1]+' '+a[0]}
function dateLabel(d){
  var dt=new Date(d+'T12:00:00');if(isNaN(dt))return '';var g,h;
  try{g=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(dt)}catch(e){g=d}
  try{h=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(dt)}catch(e){h=''}
  return '<div>'+esc(g)+' م</div>'+(h?'<div style="color:var(--gold)">'+esc(h)+'</div>':'');
}
function clockStr(){try{return new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}catch(e){return new Date().toLocaleTimeString()}}
function fmtTime(t){var a=(t||'15:30').split(':');try{return new Date(2000,0,1,+a[0],+a[1]).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true})}catch(e){return t}}
function schedStr(s){var ds=DN.filter(function(d){return (s.days||[]).indexOf(d[0])>-1}).map(function(d){return d[1]}).join('، ');return ds?ds+' · '+fmtTime(s.time):''}
function daysBox(days,add){return '<div class="row">'+DN.map(function(d){return '<label class="chk"><input type="checkbox" '+(days.indexOf(d[0])>-1?'checked ':'')+(add?'id="d_'+d[0]+'"':'onchange="upDay('+d[0]+',this.checked)"')+'>'+d[1]+'</label>'}).join('')+'</div>'}
function upDay(k,on){var s=stu(ui.sid);var a=(s.days||[]).filter(function(x){return x!==k});if(on)a.push(k);s.days=a;save()}

  var L=S.students.filter(inGf);if(!L.length){toast('لا يوجد طلاب');return}

  var pages=[],p=P_new(),W=[270,90,90,130,90,90,110,100,90],H=['الطَّالِبُ','حُضُورٌ','غِيَابٌ','نِسْبَةُ الحُضُورِ','حَافِظٌ','إِعَادَةٌ','لَمْ يُسَمِّعْ','صَفَحَاتٌ','الِالْتِزَامُ'];
  P_line(p,'إِحْصَائِيَّاتُ الشَّهْرِ',42,'#1d5c47',700,'Amiri, serif');
  P_line(p,monthName(ui.month),30,'#14332b',700);
  P_line(p,ui.gf==='all'?'كُلُّ الحَلَقَاتِ':(ui.gf==='_'?'بِدُونِ حَلْقَةٍ':(grp(ui.gf)||{name:''}).name),24,'#5d7169',400);
  P_line(p,dateTxt(today()),22,'#b8862a',400);p.y+=18;
  function cells(v,bg,col,wt){var x=p.x,cx=1120,i;x.fillStyle=bg;x.fillRect(70,p.y,1050,52);x.fillStyle=col;x.font=wt+' 21px '+FF;
    for(i=0;i<W.length;i++){if(i===0){x.textAlign='right';x.fillText(String(v[i]),cx-12,p.y+34)}else{x.textAlign='center';x.fillText(String(v[i]),cx-W[i]/2,p.y+34)}cx-=W[i]}p.y+=52}
  cells(H,'#1d5c47','#ffffff',700);
  L.forEach(function(s,k){
    if(p.y>1540){P_foot(p);pages.push(p);p=P_new();p.y=50;cells(H,'#1d5c47','#ffffff',700)}
    var m=monthStats(s,ui.month);
    cells([s.name,m.p,m.e+m.x,m.total?m.pct+'%':'—',m.done,m.rep,m.none,m.pages,streak(s)],k%2?'#f4f8f6':'#ffffff','#14332b',400);
  });
  P_foot(p);pages.push(p);savePdf(pages,'إحصائيات '+ui.month);
}

/* الإحصائيات */
function vStats(){
  var h='<div class="card row sp"><div><div class="big">إِحْصَائِيَّاتُ الشَّهْرِ</div><div style="font-weight:600;margin-top:2px">'+dateLabel(today())+'</div></div><input type="month" style="width:auto" value="'+ui.month+'" onchange="ui.month=this.value||ui.month;render()"></div>'+gfBar();
  var L=S.students.filter(inGf);
  if(!S.students.length)return h+noStudents();
  h+='<div class="card scroll"><table><tr><th>الطَّالِبُ</th><th>حُضُورٌ</th><th>غِيَابٌ</th><th>نِسْبَةُ الحُضُورِ</th><th>حَافِظٌ</th><th>إِعَادَةٌ</th><th>لَمْ يُسَمِّعْ</th><th>صَفَحَاتٌ</th><th>🔥</th></tr>';
  L.forEach(function(s){var m=monthStats(s,ui.month);h+='<tr><td>'+esc(s.name)+'</td><td>'+m.p+'</td><td>'+(m.e+m.x)+'</td><td>'+(m.total?m.pct+'%':'—')+'</td><td>'+m.done+'</td><td>'+m.rep+'</td><td>'+m.none+'</td><td>'+m.pages+'</td><td>'+streak(s)+'</td></tr>'});
  return h+'</table></div><div class="row" style="justify-content:center"><button class="btn p" onclick="pdfStats()">📄 حَفْظُ نُسْخَةِ PDF</button></div>';
}

  var p=S.profile;

  '<div class="card"><div class="big">نُسْخَةٌ احْتِيَاطِيَّةٌ</div><p class="mut">احفظ ملف النسخة في مكان آمن (واتساب لنفسك أو درايف). لو ضاع شيء ترجعه من هنا.</p><div class="row"><button class="btn p" onclick="exp()">تَصْدِيرُ البَيَانَاتِ</button></div><div id="expbox"></div></div>'+
  '<div class="card"><b>اسْتِرْجَاعُ نُسْخَةٍ</b><p class="mut">اختر ملف النسخة. سيحلّ محل البيانات الحالية.</p><input type="file" accept=".json,application/json" onchange="imp(this)"></div>'+vContact()+'<div style="text-align:center;font-family:Amiri,serif;font-size:28px;line-height:2;color:var(--gold);margin:14px 0 2px">﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾</div>';
}

async function saveContact(){
  var v='BEGIN:VCARD\r\nVERSION:3.0\r\nN;CHARSET=UTF-8:الدرعمي;محمود صلاح;;;\r\nFN;CHARSET=UTF-8:محمود صلاح الدرعمي\r\nTEL;TYPE=CELL:+'+PH_O+'\r\nTEL;TYPE=CELL:+'+PH_V+'\r\nURL:'+PORT+'\r\nEND:VCARD\r\n';
  if(isNative()){await saveFile('Mahmoud-Salah.vcf',v,'text/vcard');return}
  var f=new File([v],'Mahmoud-Salah.vcf',{type:'text/vcard'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'محمود صلاح الدرعمي'});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('جارٍ تجهيز جهة الاتصال…')}catch(e){toast('تعذّر الحفظ، استخدم زر الاتصال ثم احفظ الرقم')}
}
function setName(v){S.profile.name=v.trim()||'مَحْمُود';save();render()}
function pickPhoto(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();
    im.onload=function(){var c=document.createElement('canvas');c.width=c.height=200;var m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200);S.profile.photo=c.toDataURL('image/jpeg',0.8);save();render();toast('تم حفظ الصورة ✓')};
    im.onerror=function(){toast('الصورة غير صالحة')};im.src=r.result};
  r.readAsDataURL(f);
}
async function exp(){saveFile('halaqa-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')}
function imp(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o.students)throw 0;S=o;fix();save();toast('تم الاسترجاع');render()}catch(e){toast('الملف غير صالح')}};
  r.readAsText(f);
}

setInterval(function(){var e=$('clk');if(e)e.textContent=clockStr()},1000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!=='localhost'&&!window.Capacitor){navigator.serviceWorker.register('sw.js').catch(function(){})}
load();
