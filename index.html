var MSGS=["خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ ﷺ", "﴿وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِنْ مُدَّكِرٍ﴾", "المَاهِرُ بِالقُرْآنِ مَعَ السَّفَرَةِ الكِرَامِ البَرَرَةِ ﷺ", "اقْرَؤُوا القُرْآنَ فَإِنَّهُ يَأْتِي يَوْمَ القِيَامَةِ شَفِيعًا لِأَصْحَابِهِ ﷺ", "يُقَالُ لِصَاحِبِ القُرْآنِ: اقْرَأْ وَارْتَقِ وَرَتِّلْ كَمَا كُنْتَ تُرَتِّلُ فِي الدُّنْيَا ﷺ", "مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللهِ فَلَهُ بِهِ حَسَنَةٌ، وَالحَسَنَةُ بِعَشْرِ أَمْثَالِهَا ﷺ", "أَهْلُ القُرْآنِ هُمْ أَهْلُ اللهِ وَخَاصَّتُهُ ﷺ", "﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾", "﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾", "﴿وَقُلْ رَبِّ زِدْنِي عِلْمًا﴾", "مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ ﷺ", "مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللهُ لَهُ بِهِ طَرِيقًا إِلَى الجَنَّةِ ﷺ", "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾", "﴿إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾", "﴿فَاذْكُرُونِي أَذْكُرْكُمْ﴾", "﴿وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ﴾", "﴿وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا﴾", "صَبْرُكَ عَلَى طُلَّابِكَ عِبَادَةٌ، وَكُلُّ حَرْفٍ يَتَعَلَّمُونَهُ فِي مِيزَانِكَ بِإِذْنِ اللهِ.", "أَنْتَ تَغْرِسُ فِي قُلُوبِهِمْ نُورًا لَا يَنْطَفِئُ، فَاسْتَمِرَّ وَلَا تَمَلَّ.", "مَا أَعْظَمَ أَنْ تَكُونَ سَبَبًا فِي أَنْ يَنْطِقَ لِسَانٌ بِكَلَامِ اللهِ!", "ابْدَأْ يَوْمَكَ بِالبَسْمَلَةِ، وَاخْتِمْهُ بِالحَمْدَلَةِ، وَبَيْنَهُمَا قُرْآنٌ.", "كُلُّ طَالِبٍ تُحَفِّظُهُ هُوَ صَدَقَةٌ جَارِيَةٌ لَكَ بِإِذْنِ اللهِ.", "الإِخْلَاصُ أَوَّلُ الطَّرِيقِ، وَالصَّبْرُ زَادُهُ، وَالقُرْآنُ غَايَتُهُ.", "لَا تَسْتَقِلَّ قَلِيلَ العَمَلِ؛ فَقَطَرَاتُ المَاءِ تَصْنَعُ الأَنْهَارَ.", "رَبِّ اجْعَلْنَا مِنْ أَهْلِ القُرْآنِ الَّذِينَ هُمْ أَهْلُكَ وَخَاصَّتُكَ.", "اللَّهُمَّ بَارِكْ فِي وَقْتِكَ وَجُهْدِكَ، وَاجْعَلْ عَمَلَكَ خَالِصًا لِوَجْهِهِ الكَرِيمِ.", "تَعْلِيمُ القُرْآنِ شَرَفٌ لَا يَنَالُهُ إِلَّا مَنِ اصْطَفَاهُ اللهُ.", "ابْتَسِمْ لِطَالِبِكَ؛ فَبَسْمَتُكَ تُحَبِّبُ إِلَيْهِ القُرْآنَ.", "اللِّينُ فِي التَّعْلِيمِ يَفْتَحُ القُلُوبَ قَبْلَ الأَسْمَاعِ.", "دَعْوَةٌ صَادِقَةٌ لِطُلَّابِكَ فِي ظَهْرِ الغَيْبِ تَصْنَعُ مَا لَا تَصْنَعُهُ الكَلِمَاتُ.", "لَا تَيْأَسْ مِنْ طَالِبٍ بَطِيءِ الحِفْظِ؛ فَرُبَّ بَطِيءٍ صَارَ إِمَامًا.", "مَنْ صَبَرَ عَلَى تَحْفِيظِ القُرْآنِ نَالَ شَرَفَ الدُّنْيَا وَفَضْلَ الآخِرَةِ.", "اجْعَلْ لِنَفْسِكَ وِرْدًا لَا تَتْرُكُهُ، فَالمُعَلِّمُ أَوَّلُ مَنْ يَلْتَزِمُ.", "أَحَبُّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ ﷺ", "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، فَجَدِّدْ نِيَّتَكَ كُلَّ يَوْمٍ ﷺ", "تَعَاهَدُوا القُرْآنَ فَوَالَّذِي نَفْسِي بِيَدِهِ لَهُوَ أَشَدُّ تَفَلُّتًا مِنَ الإِبِلِ فِي عُقُلِهَا ﷺ", "﴿هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾", "﴿يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾", "مَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللهِ يَتْلُونَ كِتَابَ اللهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ ﷺ", "حَلْقَاتُ القُرْآنِ تَحُفُّهَا المَلَائِكَةُ وَتَغْشَاهَا الرَّحْمَةُ.", "كُنْ لِطُلَّابِكَ قُدْوَةً قَبْلَ أَنْ تَكُونَ مُعَلِّمًا.", "الطَّالِبُ الغَائِبُ اليَوْمَ قَدْ يَعُودُ غَدًا بِهِمَّةٍ أَعْلَى؛ فَاصْبِرْ عَلَيْهِ.", "كَمْ مِنْ آيَةٍ حَفِظَهَا طَالِبُكَ سَتَشْهَدُ لَكَ يَوْمَ القِيَامَةِ بِإِذْنِ اللهِ.", "احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللهِ وَلَا تَعْجِزْ ﷺ", "رَبِّ يَسِّرْ وَلَا تُعَسِّرْ، رَبِّ تَمِّمْ بِالخَيْرِ.", "بَارَكَ اللهُ فِي عُمُرِكَ وَعِلْمِكَ وَطُلَّابِكَ، وَجَعَلَ القُرْآنَ رَبِيعَ قَلْبِكَ.", "كُلُّ خُطْوَةٍ فِي طَرِيقِ القُرْآنِ تَرْفَعُكَ دَرَجَةً، فَلَا تَتَوَقَّفْ.", "﴿إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾", "يَوْمٌ مَعَ القُرْآنِ يُنِيرُ الدُّنْيَا وَالآخِرَةَ؛ فَابْدَأْهُ بِهِمَّةٍ.", "سَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا ﷺ"];

  fix();render();
  try{
    if(window.claude){
      var u=await claude.use('user'),db=await claude.use('db');
      if(u&&db){
        var id=await u.id();
        if(id){
          ref=db.doc('data/users/'+id+'/app');
          var snap=await ref.get(),dd=snap.exists?snap.data():null;
          if(dd&&dd.students&&(dd.updated||0)>(S.updated||0)){S=dd;fix();try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
          else if(S.students.length||S.groups.length){ref.set(JSON.parse(JSON.stringify(S)))}
          if(!ui.adding&&!ui.addG&&ui.tab!=='student')render();
        }
      }
    }
  }catch(e){}
}

/* ---------- حسابات ---------- */
function rec(s,d){return (s.recs||{})[d]}
function setRec(s,d,patch){s.recs=s.recs||{};var r=s.recs[d]||{att:'',res:'',pages:0,note:''};Object.assign(r,patch);s.recs[d]=r;save()}
function resOf(r){var v=Object.keys(r.rs||{}).map(function(k){return r.rs[k]}).filter(Boolean);if(v.length){if(v.every(function(x){return x==='n'}))return 'n';return v.indexOf('r')>-1?'r':'h'}return r.res||(r.done?'h':'')}
function okRes(r){var q=resOf(r);return q==='h'||q==='r'}
function isDay(s,d){return (s.days||[]).indexOf(new Date(d+'T12:00:00').getDay())>-1}
function dates(s){var ds=Object.keys(s.recs||{}).sort();return (s.days&&s.days.length)?ds.filter(function(d){return isDay(s,d)}):ds}
function streak(s){var ds=dates(s).reverse(),n=0;for(var i=0;i<ds.length;i++){var r=s.recs[ds[i]];if(!r.att||r.att==='e')continue;if(r.att==='p'&&okRes(r))n++;else break}return n}
function best(s){var n=0,b=0;dates(s).forEach(function(d){var r=s.recs[d];if(!r.att||r.att==='e')return;if(r.att==='p'&&okRes(r)){n++;if(n>b)b=n}else n=0});return b}
function nextGoal(n){return [7,14,30,60,100,200,365].find(function(m){return m>n})||n+100}
function agg(s,f){
  var o={p:0,e:0,x:0,done:0,rep:0,none:0,pages:0};
  Object.keys(s.recs||{}).forEach(function(d){if(f&&!f(d))return;var v=s.recs[d];
    if(v.att==='p'){o.p++;var q=resOf(v);if(q==='h')o.done++;else if(q==='r')o.rep++;else o.none++;o.pages+=Number(v.pages)||0}
    else if(v.att==='e')o.e++;else if(v.att==='x')o.x++});
  o.total=o.p+o.e+o.x;o.pct=o.total?Math.round(o.p/o.total*100):0;return o;
}
function monthStats(s,m){return agg(s,function(d){return d.slice(0,7)===m})}
function schedCount(s){if(!(s.days&&s.days.length))return 0;var n=0,d=new Date(s.joined+'T12:00:00'),end=new Date(today()+'T12:00:00');while(d<=end){if(s.days.indexOf(d.getDay())>-1)n++;d.setDate(d.getDate()+1)}return n}
function planChips(s){var p=s.plan||{};return ['h','t','m'].filter(function(k){return p[k]}).map(function(k){return '<span class="chip">'+{h:'حِفْظٌ',t:'تَثْبِيتٌ',m:'مُرَاجَعَةٌ'}[k]+'</span>'}).join('')}

function dateLabel(d){
  var dt=new Date(d+'T12:00:00');if(isNaN(dt))return '';var g,h;
  try{g=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(dt)}catch(e){g=d}

function analysisData(s){

  return {a:a,g:g,ms:ms,vals:vals,mx:mx,verdict:v,
    line:'حَافِظٌ: '+a.done+' · يُعِيدُ: '+a.rep+' · لَمْ يُسَمِّعْ: '+a.none+' · غِيَابٌ بِعُذْرٍ: '+a.e+' · بِدُونِ عُذْرٍ: '+a.x,

/* ---------- PDF ---------- */
var FF='Cairo, Tahoma, Arial, sans-serif',CREDIT='تَـمَّ إِنْـشَـاء هَـذَا التَّـطْـبِـيـق بِـوَاسِـطَـة مَـحْـمُـودٌ بْـنُ صَـلَاحٍ الدَّرْعَـمِـيُّ';
function fonts(){return Promise.all([document.fonts.load('700 30px Amiri'),document.fonts.load('400 24px Cairo'),document.fonts.load('700 24px Cairo')])}
function fnameOK(n){return String(n||'ملف').replace(/[\\\/:*?"<>|]/g,'').trim()||'ملف'}
function dateTxt(d){var dt=new Date(d+'T12:00:00'),g=d,hj='';try{g=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(dt)+' م'}catch(e){}try{hj=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(dt)}catch(e){}return g+(hj?' — '+hj:'')}
function P_new(){var c=document.createElement('canvas');c.width=1190;c.height=1684;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1190,1684);x.fillStyle='#1d5c47';x.fillRect(0,0,1190,18);x.direction='rtl';x.textBaseline='alphabetic';return {c:c,x:x,y:50}}
function P_line(p,t,sz,col,wt,fam){var x=p.x;x.font=(wt||400)+' '+sz+'px '+(fam||FF);x.fillStyle=col||'#14332b';x.textAlign='right';p.y+=sz*1.35;x.fillText(t,1120,p.y);p.y+=sz*0.2}
function P_wrap(p,t,sz,col){var x=p.x;x.font='400 '+sz+'px '+FF;var ln='';t.split(' ').forEach(function(w){var tt=ln?ln+' '+w:w;if(x.measureText(tt).width>1040&&ln){P_line(p,ln,sz,col,400);ln=w}else ln=tt});if(ln)P_line(p,ln,sz,col,400)}
function P_foot(p){var x=p.x;x.textAlign='center';x.font='700 22px Amiri, serif';x.fillStyle='#b8862a';x.fillText(CREDIT,595,1640)}
function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function mkPdf(cs){
  var ch=[],off=0,xr=[],enc=new TextEncoder();
  function w(x){var b=typeof x==='string'?enc.encode(x):x;ch.push(b);off+=b.length}
  w('%PDF-1.4\n');
  var n=cs.length,kids=cs.map(function(c,i){return (3+3*i)+' 0 R'}).join(' ');
  xr[1]=off;w('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xr[2]=off;w('2 0 obj\n<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>\nendobj\n');
  cs.forEach(function(c,i){
    var pn=3+3*i,cn=pn+1,im=pn+2,b64=c.toDataURL('image/jpeg',0.92).split(',')[1],bin=atob(b64),u=new Uint8Array(bin.length),k;
    for(k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    var cont='q 595 0 0 842 0 0 cm /Im0 Do Q';
    xr[pn]=off;w(pn+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+cn+' 0 R >>\nendobj\n');
    xr[cn]=off;w(cn+' 0 obj\n<< /Length '+cont.length+' >>\nstream\n'+cont+'\nendstream\nendobj\n');
    xr[im]=off;w(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+u.length+' >>\nstream\n');w(u);w('\nendstream\nendobj\n');
  });
  var N=3+3*n,xo=off,t='xref\n0 '+N+'\n0000000000 65535 f \n',i;
  for(i=1;i<N;i++)t+=String(xr[i]).padStart(10,'0')+' 00000 n \n';
  w(t+'trailer\n<< /Size '+N+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  var out=new Uint8Array(off),pos=0;ch.forEach(function(b){out.set(b,pos);pos+=b.length});return out;
}
function u8b64(u){var s='',i;for(i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function isNative(){var C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())}
async function saveFile(fn,data,mime){
  try{var d=window.claude&&await claude.use('downloads');if(d&&/\.(pdf|json|txt|csv)$/i.test(fn)){await d.save({filename:fn,data:data});toast('تم تجهيز الملف ✓');return true}}catch(e){if(e&&e.code==='declined')return false}
  if(isNative()){
    try{var P=Capacitor.Plugins,b64=typeof data==='string'?btoa(unescape(encodeURIComponent(data))):u8b64(data);
      var r=await P.Filesystem.writeFile({path:fn,data:b64,directory:'CACHE'});
      await P.Share.share({title:fn,url:r.uri,dialogTitle:'حفظ أو مشاركة الملف'});return true}
    catch(e){if(/cancel/i.test(String(e&&e.message||e)))return false;toast('تعذّر حفظ الملف');return false}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=fn;document.body.appendChild(a);a.click();a.remove();toast('تم التحميل ✓');return true;
}
async function savePdf(pages,name){saveFile(fnameOK(name)+'.pdf',mkPdf(pages.map(function(p){return p.c})),'application/pdf')}

  var ty=p.y+24;
  D.tiles.forEach(function(t,i){var col=i%2,row=Math.floor(i/2),W=515,H=130,xx=col?70:605,yy=ty+row*(H+18);
    x.fillStyle='#eef3f0';rr(x,xx,yy,W,H,18);x.fill();x.textAlign='center';x.fillStyle='#1d5c47';x.font='700 46px '+FF;x.fillText(String(t[0]),xx+W/2,yy+62);x.fillStyle='#5d7169';x.font='400 22px '+FF;x.fillText(t[1],xx+W/2,yy+104)});
  p.y=ty+4*148+6;

  P_line(p,'حِصَصُ التَّسْمِيعِ شَهْرِيًّا',30,'#14332b',700);
  D.ms.forEach(function(m,j){var y=p.y+8;x.textAlign='right';x.fillStyle='#14332b';x.font='400 24px '+FF;x.fillText(monthName(m),1120,y+22);x.textAlign='left';x.fillText(String(D.vals[j]),70,y+22);
    x.fillStyle='#d6e0db';rr(x,70,y+32,1050,14,7);x.fill();var w=Math.round(1050*D.vals[j]/D.mx);if(w>0){x.fillStyle='#1d5c47';rr(x,1120-w,y+32,w,14,7);x.fill()}p.y=y+54});
  p.y+=12;P_line(p,'الخُلَاصَةُ',30,'#14332b',700);P_wrap(p,D.verdict,26,'#14332b');
  P_foot(p);savePdf([p],s.name);
