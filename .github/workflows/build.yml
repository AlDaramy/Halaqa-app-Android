name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files into folders
        run: |
          mkdir -p www/icons assets
          for f in index.html manifest.webmanifest sw.js; do if [ -f "$f" ]; then mv "$f" www/; fi; done
          for f in apple-touch-icon.png icon-192.png icon-512.png; do if [ -f "$f" ]; then mv "$f" www/icons/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv "$f" assets/; fi; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Generate icons and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1d5c47' --splashBackgroundColor '#1d5c47'
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Halaqa-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
